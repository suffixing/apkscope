name: ci

# Quality gate + cross-platform test/build matrix; release tags (v*) are
# handled by release.yml instead. Pinned actions are Node 24-compatible —
# Node 20 was removed from GitHub-hosted runners on 2026-09-23.

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
    # docs-only pushes do not touch any Rust code, and no CI job compiles
    # markdown: skipping the 3-OS matrix for them saves the full run.
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "assets/logo.py"
      - ".gitignore"
      - "LICENSE"
      - "NOTICE"
  pull_request:
    # same scope on PRs: the filter applies to the changed files of the
    # PR, so docs-only PRs skip the build matrix as well. Careful: paths
    # filters on pull_request use the PR's diff, so any code change in a
    # mixed docs+code PR still runs the full matrix.
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "assets/logo.py"
      - ".gitignore"
      - "LICENSE"
      - "NOTICE"
  workflow_dispatch:
    # manual re-run without the path filters, for exactly the mixed
    # docs+code case above or when a skipped run needs a forced run

# push + pull_request overlap on every open-PR push: without cancellation
# both copies run to completion, doubling runner minutes for the same SHA.
# One in-flight run per branch/PR is enough; a fresh push supersedes it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# least privilege; the workflow never writes to the repo, so the default
# read/write token would be pure risk surface. Overridden only where a
# job must write (none here; release.yml grants its release job contents:write).
permissions:
  contents: read

env:
  # rust-cache sets this anyway; making it explicit keeps any uncached
  # local run consistent with what CI does.
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # CLI + MCP server only — the macOS release build; the Linux and
      # Windows release builds (default features, viewer included) are
      # compiled by the build matrix below
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          # key on the lint job name, not the job id: caches saved by a
          # PR-event run of the same code are restorable by the next
          # branch push (and vice versa), instead of one cache per run
          shared-key: lint-check
          # save the cache even when the job fails, so a broken commit
          # does not throw away minutes of dependency compilation
          cache-on-failure: true
      - run: cargo check --release --no-default-features

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: lint-clippy
          cache-on-failure: true
      - run: cargo clippy --release --no-default-features -- -D warnings
      # the viewer build and the tests are linted too, so neither collects warnings again
      - run: cargo clippy --release -- -D warnings
      - run: cargo clippy --release --no-default-features --tests -- -D warnings
      # the cargo bench target (#64) as well: CI never runs it, only compiles it
      - run: cargo clippy --release --no-default-features --benches -- -D warnings

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux-x64 }
          - { os: macos-latest, name: macos-arm64, optional: true }
          - { os: windows-latest, name: windows-x64 }
    runs-on: ${{ matrix.os }}
    # macOS arm64 runners are often unavailable (GitHub capacity); don't fail the run for that
    continue-on-error: ${{ matrix.optional == true }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          # one cache per OS: the target dir is not portable between
          # Linux/macOS/Windows dependency builds. release.yml reuses the
          # same shared-keys per platform. Cache visibility is ref-scoped:
          # caches saved here on the default branch reach later tag runs;
          # caches saved on a feature branch stay on that branch (and
          # PR-event runs save under the merge ref, restorable only by
          # that PR itself) — worst case a job compiles cold once.
          shared-key: build-${{ matrix.os }}
          cache-on-failure: true
      - run: cargo test --release --no-default-features
      # build what the release ships: macOS the CLI + MCP server, Linux and
      # Windows the viewer build — one binary with the GUI, the CLI and the
      # MCP server, exactly the binaries the release attaches
      - if: matrix.os == 'macos-latest'
        run: cargo build --release --no-default-features
      - if: matrix.os != 'macos-latest'
        run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: apkscope-${{ matrix.name }}
          path: |
            target/release/apkscope
            target/release/apkscope.exe
          if-no-files-found: ignore
      # the static CLI + MCP server on Linux, like the release: for servers,
      # containers and musl distros (Alpine) — no viewer, and it says so when
      # asked (a static binary cannot dlopen() the desktop's X11/Wayland/GL)
      - if: matrix.os == 'ubuntu-24.04'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get install -y musl-tools
      - if: matrix.os == 'ubuntu-24.04'
        run: cargo build --release --no-default-features --target x86_64-unknown-linux-musl
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      # the Linux binaries, packaged like the release (.deb + AppImage); pinned
      # to 24.04 because the glibc build links glibc dynamically — building on
      # the oldest supported LTS keeps it installable everywhere.
      - if: matrix.os == 'ubuntu-24.04'
        run: |
          mkdir -p dist
          cp target/release/apkscope dist/apkscope_linux_x86_64
          cp target/x86_64-unknown-linux-musl/release/apkscope dist/apkscope_linux_musl_x86_64
          packaging/linux/package.sh target/release/apkscope dist
      - if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v7
        with:
          name: apkscope-packages-linux-x64
          path: dist/
