[package]
name = "apkscope"
version = "0.13.0"
edition = "2024"
description = "Android APK decompiler, xref engine and MCP server for AI agents: readable Java, API recon, Gradle export, APK re-signing and a native viewer, in one small binary"
license = "Apache-2.0"
repository = "https://github.com/suffixing/apkscope"

[workspace]
members = ["core"]
# plain cargo commands build and test both crates
default-members = [".", "core"]

[dependencies]
apkscope-core = { path = "core" }
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "accesskit", "x11", "wayland"], optional = true }
libdeflater = "1.26"
mimalloc = { version = "0.1", default-features = false }
miniz_oxide = "0.8"
regex = "1"
rfd = { version = "0.15", optional = true }
serde_json = "1"
# already in the tree through apkscope-core (APK signing); `update` reuses it
# to verify release checksums, so this adds no new external code
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }

[[bin]]
name = "apkscope"
path = "src/main.rs"
# the bin's unit tests run under `cargo test`; keeping them out of `cargo bench`
# lets `cargo bench -- <harness flags>` forward every flag to the bench target below
bench = false

[[bench]]
name = "bench"
path = "benches/bench/main.rs"
# custom harness (#64): builds refs, measures subprocesses, prints the PR table;
# the target is split one file per stage under benches/bench/ (see its module docs)
harness = false

[features]
# the native viewer; `cargo build --release --no-default-features` gives the CLI + MCP server only
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
embed-resource = "2"
