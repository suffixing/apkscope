[package]
name = "apkscope"
version = "0.5.2"
edition = "2024"
description = "Android APK decompiler, xref engine and MCP server for AI agents: readable Java, API recon, Gradle export, APK re-signing and a native viewer, in one small binary"
license = "Apache-2.0"
repository = "https://github.com/suffixing/apkscope"

[dependencies]
crc32fast = "1"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"], optional = true }
libdeflater = "1.26"
mimalloc = { version = "0.1", default-features = false }
miniz_oxide = "0.8"
rand = "0.8"
regex = "1"
rfd = { version = "0.15", optional = true }
rsa = { version = "0.9", features = ["sha2"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }

[features]
# the native viewer; `cargo build --release --no-default-features` gives the CLI + MCP server only
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
embed-resource = "2"
